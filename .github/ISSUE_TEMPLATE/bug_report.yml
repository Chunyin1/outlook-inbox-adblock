name: Bug report
description: Report an installation, filtering, or uninstall problem
body:
  - type: markdown
    attributes:
      value: |
        Do not include mailbox screenshots, email addresses, network traces, profile files, tokens, or raw logs. Report security vulnerabilities privately using the Security tab.
  - type: textarea
    id: versions
    attributes:
      label: Versions and mode
      description: Windows version, new Outlook version, Node.js version (full mode), and Full or HostsOnly mode.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe the problem and steps to reproduce it without including personal information.
    validations:
      required: true
  - type: textarea
    id: safe-error
    attributes:
      label: Sanitized error message
      description: Optional. Remove usernames, account identifiers, and local paths before pasting a short error message.
